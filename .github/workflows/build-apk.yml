name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          echo "Using Android SDK at: $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK with Persistent Signing Keystore
        working-directory: ./android-app
        run: |
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/sms-router-v1.0.4.apk

      - name: Upload Named APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sms-router-v1.0.4-apk
          path: android-app/app/build/outputs/apk/debug/sms-router-v1.0.4.apk

      - name: Publish In-App Update Release on GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.4
          name: "SMS Router v1.0.4 (Persistent Signing + 4-Layer SMS/RCS Engine)"
          body: "Release v1.0.4 signed with persistent PKCS12 keystore (`sms-router-signing.jks`) so all future in-app updates install seamlessly in-place, plus 4-Layer SMS & RCS Capture."
          draft: false
          prerelease: false
          files: android-app/app/build/outputs/apk/debug/sms-router-v1.0.4.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
